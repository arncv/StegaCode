name: Release binaries

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag version
        shell: python
        run: |
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          if os.environ['GITHUB_REF_NAME'] != f'v{version}':
              raise SystemExit('Release tag must match the Cargo.toml version')
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package executable, documentation and checksum
        shell: python
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          import hashlib, os, pathlib, tarfile, zipfile
          target = os.environ['RELEASE_TARGET']
          windows = 'windows' in target
          binary = 'stegacode.exe' if windows else 'stegacode'
          folder = pathlib.Path('dist')
          folder.mkdir(exist_ok=True)
          base = f"stegacode-{os.environ['GITHUB_REF_NAME']}-{target}"
          files = [(pathlib.Path('target') / target / 'release' / binary, binary),
                   (pathlib.Path('README.md'), 'README.md'),
                   (pathlib.Path('LICENSE'), 'LICENSE'),
                   (pathlib.Path('docs/format.md'), 'docs/format.md')]
          archive = folder / (base + ('.zip' if windows else '.tar.gz'))
          if windows:
              with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as output:
                  for source, name in files:
                      output.write(source, name)
          else:
              with tarfile.open(archive, 'w:gz') as output:
                  for source, name in files:
                      output.add(source, arcname=name)
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          pathlib.Path(str(archive) + '.sha256').write_text(f'{digest}  {archive.name}\n')
      - uses: actions/upload-artifact@v4
        with:
          name: stegacode-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
